<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>ClipShot 预览</title>
  <link rel="stylesheet" href="preview.css">
</head>
<body>
  <!-- 编辑态工具栏(P007):默认隐藏,由 edit.js 填充 -->
  <div id="editbar"></div>

  <div id="notes"></div>
  <div id="status" class="status hidden"></div>

  <main id="stage">
    <div id="wrap"></div>
  </main>

  <!-- 右下角控制面板(P012 布局,P014 增强):信息 + 无级缩放 + 画板操作 + 编辑/复制/下载 -->
  <div id="previewbar" class="no-main">
    <div id="info" class="pb-info">加载中…</div>
    <div class="pb-row pb-main pb-zoom">
      <button id="zoom-out" title="缩小(×0.9 细调)">－</button>
      <input id="zoom-range" type="range" min="5" max="400" step="1" value="100" title="拖动无级缩放(5%–400%)">
      <button id="zoom-in" title="放大(×1.1 细调)">＋</button>
      <span class="zoom-num"><input id="zoom-num" type="number" min="5" max="400" step="1" value="100" title="直接输入缩放百分比,回车生效">%</span>
      <button id="zoom-fit" title="适应窗口宽度">适应</button>
      <button id="zoom-100" title="实际像素">100%</button>
    </div>
    <div class="pb-row pb-board">
      <button id="btn-addimg" title="往画板继续添加图片(也可 Ctrl+V 直接粘贴)">＋ 图片</button>
      <button id="btn-blank" title="新建一块空白画布,从零作画(非破坏,追加为卡片)">▢ 空白画布</button>
      <button id="btn-bg" title="画板背景:透明/白板/常用色/自定义,导出带底色">🎨 背景</button>
    </div>
    <div class="pb-row pb-main">
      <button id="btn-edit" class="primary" title="像微信一样标注(快捷键 E);空白处也能写字画形状">✎ 编辑</button>
      <button id="btn-copy" title="复制当前呈现(含标注与画板层)到剪贴板">复制</button>
      <button id="btn-download" title="打开导出弹窗:剪裁/转格式/压缩/缩放,看清效果再下载">下载</button>
    </div>
  </div>
  <input id="fi-add" type="file" accept="image/*" multiple hidden>

  <!-- 画板背景选择弹层(P014):常用色 + 自定义取色器 -->
  <div id="bgpop" hidden>
    <label class="bg-custom">自定义 <input id="bg-custom" type="color" value="#ffffff" title="自定义颜色"></label>
  </div>

  <!-- 操作提示(P012):底部居中轻提示,自动消失不干扰 -->
  <div id="toasts"></div>

  <!-- 导出弹窗(P010):左原图右效果,滑杆即调即看;主按钮标明格式与大小 -->
  <div id="dlmodal" hidden>
    <div class="dlg-mask" id="dlg-mask"></div>
    <div class="dlg" role="dialog" aria-modal="true" aria-label="导出图片" id="dlg">
      <div class="dlg-head">
        <strong>导出图片</strong>
        <span class="dlg-head-btns">
          <button id="dlg-fs" class="mini" title="弹窗铺满整个页面,看得更清(Esc 退出)">⛶ 全屏</button>
          <button id="dlg-close" title="关闭(Esc)">×</button>
        </span>
      </div>
      <div class="dlg-compare">
        <figure>
          <div class="pane" id="dlg-pane-src">
            <img id="dlg-src" alt="原图" title="点击放大查看">
            <span class="pane-hint" id="dlg-crop-hint" hidden>在图上拖拽框选保留区域,松手即生效</span>
            <div class="crop-box" id="dlg-cropbox" hidden><span class="crop-size" id="dlg-cropbox-size"></span></div>
          </div>
          <figcaption>
            <span>原图 <span id="dlg-src-info"></span></span>
            <span class="cap-btns">
              <button id="dlg-crop" class="mini" title="框选保留区域,导出只保留框内内容">✂ 剪裁</button>
              <button id="dlg-crop-clear" class="mini" hidden title="取消剪裁,恢复整张图">清除剪裁</button>
            </span>
          </figcaption>
        </figure>
        <figure>
          <div class="pane"><img id="dlg-out" alt="导出效果" title="点击放大查看"><span id="dlg-out-tip" class="pane-tip" hidden></span></div>
          <figcaption>导出效果 <span id="dlg-out-info"></span></figcaption>
        </figure>
      </div>
      <div class="dlg-controls">
        <label>格式
          <select id="dl-format">
            <option value="original">原始(保持原格式)</option>
            <option value="png">PNG(无损,体积大)</option>
            <option value="jpeg">JPEG(体积小,不支持透明)</option>
            <option value="webp">WebP(体积小,支持透明)</option>
          </select>
        </label>
        <label id="dl-quality-row">压缩质量
          <input id="dl-quality" type="range" min="10" max="100" step="1" value="85">
          <span id="dl-quality-v" class="dlg-val">85%</span>
        </label>
        <label>缩放
          <input id="dl-scale" type="range" min="10" max="100" step="5" value="100">
          <span id="dl-scale-v" class="dlg-val">100%</span>
        </label>
      </div>
      <div class="dlg-foot">
        <span id="dlg-summary" class="info"></span>
        <span class="dlg-spacer"></span>
        <button id="dlg-cancel">取消</button>
        <button id="dlg-go" class="primary">下载</button>
      </div>
    </div>
  </div>

  <!-- 放大查看灯箱(P011):原图/导出图同位切换,点击图切换 适应窗口/100% -->
  <div id="lightbox" hidden>
    <div class="lb-mask" id="lb-mask"></div>
    <div class="lb-wrap" id="lb-wrap">
      <div class="lb-bar">
        <span id="lb-title">原图</span>
        <button id="lb-src" class="on">原图</button>
        <button id="lb-out">导出图</button>
        <button id="lb-zoom" title="点击切换 适应窗口 / 100% 原大">适应窗口</button>
        <button id="lb-zout" title="缩小">−</button>
        <button id="lb-zin" title="放大">＋</button>
        <span class="info">←/→ 切换 · 点图缩放 · Ctrl+滚轮缩放 · Esc 关闭</span>
        <span class="dlg-spacer" style="flex:1"></span>
        <button id="lb-close" title="关闭(Esc)">×</button>
      </div>
      <div id="lb-view"><img id="lb-img" class="fit" alt="放大查看"></div>
    </div>
  </div>

  <canvas id="editlayer"></canvas>

  <script src="../common/messages.js"></script>
  <script src="../common/geom.js"></script>
  <script src="../common/naming.js"></script>
  <script src="../common/upload.js"></script>
  <script src="edit.js"></script>
  <script src="preview.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>ClipShot 预览</title>
  <link rel="stylesheet" href="preview.css">
</head>
<body>
  <header>
    <div class="left">
      <strong>ClipShot 预览</strong>
      <span id="info" class="info">加载中…</span>
    </div>
    <div class="right">
      <button id="zoom-out" title="缩小">－</button>
      <button id="zoom-fit">适应宽度</button>
      <button id="zoom-100">100%</button>
      <button id="zoom-in" title="放大">＋</button>
      <span id="zoom-label" class="info"></span>
    </div>
  </header>

  <!-- 编辑态工具栏(P007):默认隐藏,由 edit.js 填充 -->
  <div id="editbar"></div>

  <div id="notes"></div>
  <div id="status" class="status hidden"></div>

  <main id="stage">
    <div id="wrap"></div>
  </main>

  <!-- 预览态动作栏:想编辑才点「编辑」,否则复制/下载直接走 -->
  <div id="previewbar">
    <button id="btn-edit" class="primary" title="像微信一样标注(快捷键 E)">✎ 编辑</button>
    <button id="btn-copy" title="复制当前呈现(含标注)到剪贴板">复制</button>
    <button id="btn-download" title="打开导出弹窗:转格式/压缩/缩放,看清效果再下载">下载</button>
  </div>

  <!-- 导出弹窗(P010):左原图右效果,滑杆即调即看;主按钮标明格式与大小 -->
  <div id="dlmodal" hidden>
    <div class="dlg-mask" id="dlg-mask"></div>
    <div class="dlg" role="dialog" aria-modal="true" aria-label="导出图片" id="dlg">
      <div class="dlg-head">
        <strong>导出图片</strong>
        <button id="dlg-close" title="关闭(Esc)">×</button>
      </div>
      <div class="dlg-compare">
        <figure>
          <div class="pane"><img id="dlg-src" alt="原图"></div>
          <figcaption>原图 <span id="dlg-src-info"></span></figcaption>
        </figure>
        <figure>
          <div class="pane"><img id="dlg-out" alt="导出效果"><span id="dlg-out-tip" class="pane-tip" hidden></span></div>
          <figcaption>导出效果 <span id="dlg-out-info"></span></figcaption>
        </figure>
      </div>
      <div class="dlg-controls">
        <label>格式
          <select id="dl-format">
            <option value="original">原始(保持原格式)</option>
            <option value="png">PNG(无损,体积大)</option>
            <option value="jpeg">JPEG(体积小,不支持透明)</option>
            <option value="webp">WebP(体积小,支持透明)</option>
          </select>
        </label>
        <label id="dl-quality-row">压缩质量
          <input id="dl-quality" type="range" min="10" max="100" step="1" value="85">
          <span id="dl-quality-v" class="dlg-val">85%</span>
        </label>
        <label>缩放
          <input id="dl-scale" type="range" min="10" max="100" step="5" value="100">
          <span id="dl-scale-v" class="dlg-val">100%</span>
        </label>
      </div>
      <div class="dlg-foot">
        <span id="dlg-summary" class="info"></span>
        <span class="dlg-spacer"></span>
        <button id="dlg-cancel">取消</button>
        <button id="dlg-go" class="primary">下载</button>
      </div>
    </div>
  </div>

  <canvas id="editlayer"></canvas>

  <script src="../common/messages.js"></script>
  <script src="../common/geom.js"></script>
  <script src="../common/naming.js"></script>
  <script src="../common/upload.js"></script>
  <script src="edit.js"></script>
  <script src="preview.js"></script>
</body>
</html>

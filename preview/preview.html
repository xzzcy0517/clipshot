<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>ClipShot 预览</title>
  <link rel="stylesheet" href="preview.css">
</head>
<body>
  <header>
    <div class="left">
      <strong>ClipShot 预览</strong>
      <span id="info" class="info">加载中…</span>
    </div>
    <div class="right">
      <button id="zoom-out" title="缩小">－</button>
      <button id="zoom-fit">适应宽度</button>
      <button id="zoom-100">100%</button>
      <button id="zoom-in" title="放大">＋</button>
      <span id="zoom-label" class="info"></span>
    </div>
  </header>

  <!-- 编辑态工具栏(P007):默认隐藏,由 edit.js 填充 -->
  <div id="editbar"></div>

  <div id="notes"></div>
  <div id="status" class="status hidden"></div>

  <main id="stage">
    <div id="wrap"></div>
  </main>

  <!-- 预览态动作栏:想编辑才点「编辑」,否则复制/下载直接走 -->
  <div id="previewbar">
    <button id="btn-edit" class="primary" title="像微信一样标注(快捷键 E)">✎ 编辑</button>
    <button id="btn-copy" title="复制当前呈现(含标注)到剪贴板">复制</button>
    <button id="btn-download" title="下载当前呈现(含标注)">下载</button>
    <button id="btn-dlopts" title="下载选项:格式/质量/缩放">▾</button>
  </div>
  <!-- 下载选项面板(P009):格式/质量/缩放,即选即用 -->
  <div id="dlpanel" hidden>
    <label>格式
      <select id="dl-format">
        <option value="original">原始</option>
        <option value="png">PNG</option>
        <option value="jpeg">JPEG</option>
        <option value="webp">WebP</option>
      </select>
    </label>
    <label id="dl-quality-row">质量
      <input id="dl-quality" type="range" min="60" max="100" value="85">
      <span id="dl-quality-v">85</span>
    </label>
    <label>缩放
      <select id="dl-scale">
        <option value="100">100%</option>
        <option value="75">75%</option>
        <option value="50">50%</option>
      </select>
    </label>
  </div>

  <canvas id="editlayer"></canvas>

  <script src="../common/messages.js"></script>
  <script src="../common/geom.js"></script>
  <script src="../common/naming.js"></script>
  <script src="../common/upload.js"></script>
  <script src="edit.js"></script>
  <script src="preview.js"></script>
</body>
</html>

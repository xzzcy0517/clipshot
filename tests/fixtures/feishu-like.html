<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>ClipShot 夹具:超长内部容器文档(模拟飞书)</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font: 14px system-ui; }
  .doc { height: 100vh; overflow-y: auto; }
  .bar { position: fixed; top: 0; left: 0; right: 0; height: 48px; background: #2f6fe4; color: #fff; line-height: 48px; padding-left: 14px; z-index: 9; }
  .band { height: 2000px; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #fff; }
</style>
</head>
<body>
<div class="bar">模拟飞书顶栏(fixed,应隐藏且不留空位错位)</div>
<div class="doc" id="doc"><div id="wrap" style="padding-top:48px"></div></div>
<script>
  // 20000 CSS px 高的内部滚动容器:超过单边纹理上限(16000),必然走「分段→预览合成」。
  // 验收:① 注记第一条为「已分 N 段捕获」;② 预览合成为一张(总高≤30000 装进一卷);
  // ③ 尾部色带 18000–20000 必须是深色 #ccb 段,不得出现首屏内容(v0.4.2 回绕 bug 回归);
  // ④ Agent paths 多段文件逐个可读。
  const wrap = document.getElementById('wrap');
  const palette = ['#456','#678','#89a','#abc','#bcd','#cde','#def','#fdd','#ecc','#ccb'];
  for (let i = 0; i < 10; i++) {
    const b = document.createElement('div');
    b.className = 'band';
    b.style.background = palette[i];
    b.textContent = (i * 2000) + ' – ' + ((i + 1) * 2000) + ' px';
    wrap.appendChild(b);
  }
</script>
</body>
</html>

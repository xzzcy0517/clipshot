<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>ClipShot 夹具:超长页面(降尺度单张 / 分段兜底)</title>
<style>
  body { margin: 0; font: 14px system-ui; }
  .band { height: 1000px; display: flex; align-items: center; justify-content: center; font-size: 28px; color: #fff; }
  header { position: fixed; top: 0; left: 0; right: 0; height: 40px; background: #c0c; color: #fff; line-height: 40px; padding-left: 12px; z-index: 9; }
</style>
</head>
<body>
<header>紫色 fixed 顶栏(隐藏开启时长图里只允许出现 0 次)</header>
<!-- 30000px:超单边上限(16000)→ 分段拍摄(约 8 段),预览合成单张
     (总高 30000 恰在分卷上限内)。验收:尾部 29000–30000 色带存在且非首屏内容,
     段缝处色带边界无缝无重复。 -->
<div id="wrap"></div>
<script>
  // 30000 CSS px 高,每 1000px 一条色带与标签,肉眼检查分段拼接边界无重复/无缝隙
  const wrap = document.getElementById('wrap');
  const palette = ['#456','#678','#89a','#abc','#bcd','#cde','#def','#fee','#edd','#dcc'];
  for (let i = 0; i < 30; i++) {
    const band = document.createElement('div');
    band.className = 'band';
    band.style.background = palette[i % palette.length];
    band.textContent = (i * 1000) + ' – ' + ((i + 1) * 1000) + ' px';
    wrap.appendChild(band);
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>ClipShot 设置</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <h1>ClipShot 设置</h1>

  <fieldset>
    <legend>输出</legend>
    <label>图片格式
      <select id="format">
        <option value="png">PNG(无损,体积大)</option>
        <option value="jpeg">JPEG(有损,体积小)</option>
      </select>
    </label>
    <label>JPEG 质量(<span id="quality-val">85</span>)
      <input type="range" id="jpegQuality" min="60" max="100" step="1">
    </label>
    <label class="row"><input type="checkbox" id="autoJpegForLong">页面超过一定长度时自动改用 JPEG(控制体积)</label>
    <label>自动改 JPEG 的高度阈值(CSS px)<input type="number" id="autoJpegMinCssH" min="4000" max="30000" step="500"></label>
  </fieldset>

  <fieldset>
    <legend>整页截图</legend>
    <label class="row"><input type="checkbox" id="hideFixed">截图时隐藏固定元素(fixed / sticky)</label>
    <label>滚动速度
      <select id="scrollSpeed">
        <option value="fast">快(每步 0.9 屏,适合轻量页)</option>
        <option value="standard">标准(每步 0.75 屏)</option>
        <option value="slow">慢(每步 0.6 屏,适合重懒加载页)</option>
      </select>
    </label>
    <label>分段阈值:页面高度超过该值改用分段捕获(CSS px)<input type="number" id="splitThreshold" min="8000" max="24000" step="500"></label>
    <label>每段高度(CSS px)<input type="number" id="chunkHeight" min="1000" max="8000" step="250"></label>
    <label>最大滚动行程(CSS px,无限流保护)<input type="number" id="maxScrollPx" min="5000" max="100000" step="1000"></label>
    <label>总长上限:整页最多截取这么多(CSS px,超出截断并明示)<input type="number" id="maxTotalCssH" min="10000" max="200000" step="5000"></label>
    <label>单图上限:分段时每张图的高度上限(设备 px)<input type="number" id="maxPartDeviceH" min="4000" max="24000" step="1000"></label>
  </fieldset>


  <div class="mini">设置自动保存。扩展版本 <span id="ver"></span>
    — 排障用的页面诊断已移至工具栏面板(打开某个网页 → 点 ClipShot 图标 → 「诊断当前页面」)。</div>

  <script src="../common/messages.js"></script>
  <script src="../common/settings.js"></script>
  <script src="options.js"></script>
</body>
</html>

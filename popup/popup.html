<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>ClipShot</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>ClipShot 滚动长截图</h1>

  <div class="btns">
    <button id="btn-visible" class="primary">可视区域截图(所有页面可用)</button>
    <button id="btn-full">整页滚动长截图</button>
    <button id="btn-full-manual">整页截图(手动预热·先滚到底再点我)</button>
    <button id="btn-region">框选区域截图</button>
  </div>
  <div class="hint" id="hint">截取单个元素:在目标元素上<strong>右键 → ClipShot:截取此元素</strong></div>

  <div id="progress" class="progress hidden">
    <div class="bar"><div id="barfill"></div></div>
    <div id="progresstext">准备中…</div>
    <button id="btn-cancel" class="link">取消</button>
  </div>

  <fieldset>
    <legend>图片工具</legend>
    <button id="btn-openimg">打开图片编辑(可多选)</button>
    <input type="file" id="file-img" accept="image/*" multiple hidden>
    <div class="mini">上传后在新标签页标注/转格式/压缩;单张 ≤50MB,单批 ≤150MB</div>
  </fieldset>

  <fieldset>
    <legend>快捷设置</legend>
    <label>图片格式
      <select id="format">
        <option value="png">PNG(无损)</option>
        <option value="jpeg">JPEG(体积小)</option>
      </select>
    </label>
    <label class="row"><input type="checkbox" id="hideFixed"> 截图时隐藏固定元素与页头(sticky 顶栏/悬浮窗/飞书类页头)</label>
    <div class="mini">完整设置(滚动速度、分段阈值等):<a href="#" id="open-options">打开设置页</a></div>
  </fieldset>

  <div class="foot-row">
    <button id="btn-diag" class="link" title="对当前网页导出 layoutMetrics 诊断 JSON 并复制到剪贴板(会短暂出现调试提示条)">诊断当前页面(复制排障 JSON)</button>
  </div>

  <div id="notice" class="notice hidden"></div>

  <script src="../common/messages.js"></script>
  <script src="../common/settings.js"></script>
  <script src="../common/upload.js"></script>
  <script src="popup.js"></script>
</body>
</html>
